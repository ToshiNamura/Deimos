version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"

# CMake dependencies are pinned in cmake/DeimosDependencies.cmake and are bumped by
# editing the version variables there; Dependabot has no ecosystem for FetchContent.
