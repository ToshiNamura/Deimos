name: Bug report
description: Report behaviour that does not match the documentation
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Security problems do not belong here - use the
        **Security** tab instead (see SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What should have happened according to the documentation?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest sequence of commands or clicks that shows the problem.
      placeholder: |
        1. deimosd --foreground --config ...
        2. deimos profiles activate tls-split
        3. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Deimos version
      description: Output of `deimosd --version` and `deimos --version`.
      placeholder: "0.1.0"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows 11
        - Windows 10
        - Linux (systemd)
        - Linux (other)
        - macOS
        - Router or embedded Linux
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - deimosd daemon
        - REST API
        - Command line client
        - Desktop interface
        - Profiles and strategies
        - Building, install or packaging
    validations:
      required: true

  - type: input
    id: zapret
    attributes:
      label: zapret
      description: Which tool is used (`winws`, `nfqws`, `tpws`), its version, and the install directory.
      placeholder: "nfqws 1.0, /opt/zapret"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >
        Output of `deimos logs --limit 200`, or an excerpt of `deimosd.log` from the state
        directory. Remove tokens and private host names first.
      render: text
    validations:
      required: false

  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: The relevant part of `deimos.json` with tokens and private host names removed.
      render: json
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I removed tokens, keys and private host names from everything pasted here.
          required: true
        - label: I searched the existing issues for the same problem.
          required: true
